basePath: /api/v1
definitions:
  auth.Achievement:
    properties:
      category:
        type: string
      created_at:
        type: string
      description:
        type: string
      icon:
        type: string
      id:
        type: string
      name:
        type: string
      points:
        type: integer
      updated_at:
        type: string
    type: object
  auth.AuthResponse:
    properties:
      expires_at:
        example: "2024-01-02T00:00:00Z"
        type: string
      token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      user:
        $ref: '#/definitions/auth.User'
    type: object
  auth.LoginRequest:
    properties:
      password:
        example: securepassword123
        type: string
      username:
        example: gardener123
        type: string
    required:
    - password
    - username
    type: object
  auth.PublicUser:
    properties:
      avatar:
        type: string
      id:
        type: string
      level:
        type: integer
      username:
        type: string
    type: object
  auth.RegisterRequest:
    properties:
      email:
        example: gardener@example.com
        type: string
      first_name:
        example: John
        type: string
      last_name:
        example: Doe
        type: string
      password:
        example: securepassword123
        minLength: 6
        type: string
      username:
        example: gardener123
        maxLength: 20
        minLength: 3
        type: string
    required:
    - email
    - password
    - username
    type: object
  auth.User:
    properties:
      achievements:
        items:
          $ref: '#/definitions/auth.UserAchievement'
        type: array
      avatar:
        type: string
      coins:
        type: integer
      created_at:
        type: string
      email:
        type: string
      experience:
        type: integer
      first_name:
        type: string
      id:
        type: string
      language:
        type: string
      last_login_at:
        type: string
      last_name:
        type: string
      level:
        type: integer
      timezone:
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
  auth.UserAchievement:
    properties:
      achievement:
        $ref: '#/definitions/auth.Achievement'
      achievement_id:
        type: string
      id:
        type: string
      unlocked_at:
        type: string
      user_id:
        type: string
    type: object
  garden.CreateAccessLinkRequest:
    properties:
      expires_at:
        type: string
      garden_id:
        type: string
      max_uses:
        type: integer
      permissions:
        items:
          $ref: '#/definitions/garden.GardenPermission'
        type: array
    required:
    - garden_id
    - permissions
    type: object
  garden.CreateGardenRequest:
    properties:
      description:
        example: A beautiful garden for growing vegetables
        type: string
      name:
        example: My First Garden
        maxLength: 100
        minLength: 1
        type: string
    required:
    - name
    type: object
  garden.Garden:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      plants:
        description: Relationships
        items:
          $ref: '#/definitions/garden.Plant'
        type: array
      updated_at:
        type: string
      user:
        $ref: '#/definitions/auth.PublicUser'
      user_id:
        type: string
    type: object
  garden.GardenPermission:
    enum:
    - view
    - plant
    - harvest
    - manage
    type: string
    x-enum-varnames:
    - GardenPermissionView
    - GardenPermissionPlant
    - GardenPermissionHarvest
    - GardenPermissionManage
  garden.JoinGardenRequest:
    properties:
      token:
        type: string
    required:
    - token
    type: object
  garden.Plant:
    properties:
      created_at:
        type: string
      garden:
        allOf:
        - $ref: '#/definitions/garden.Garden'
        description: Relationships
      garden_id:
        type: string
      growth_progress:
        description: 0-100
        type: number
      harvested_at:
        type: string
      id:
        type: string
      plant_type:
        $ref: '#/definitions/garden.PlantType'
      plant_type_id:
        type: string
      planted_at:
        description: Timestamps
        type: string
      position:
        description: Position in garden grid (0-8 for 3x3 grid)
        type: integer
      stage:
        allOf:
        - $ref: '#/definitions/garden.PlantStage'
        description: Plant state
      updated_at:
        type: string
    type: object
  garden.PlantRequest:
    properties:
      plant_type_id:
        example: 123e4567-e89b-12d3-a456-426614174000
        type: string
      position:
        example: 0
        maximum: 8
        minimum: 0
        type: integer
    required:
    - plant_type_id
    - position
    type: object
  garden.PlantStage:
    enum:
    - seed
    - sprout
    - growing
    - mature
    - harvestable
    type: string
    x-enum-varnames:
    - PlantStageSeed
    - PlantStageSprout
    - PlantStageGrowing
    - PlantStageMature
    - PlantStageHarvestable
  garden.PlantType:
    properties:
      description:
        type: string
      growth_time:
        description: Growth properties
        type: integer
      harvest_value:
        type: integer
      icon:
        type: string
      id:
        type: string
      name:
        type: string
      seed_price:
        description: Store properties
        type: integer
      yield:
        description: items per harvest
        type: integer
    type: object
  garden.UpdateGardenRequest:
    properties:
      description:
        example: Updated garden description
        type: string
      name:
        example: Updated Garden Name
        type: string
    type: object
  garden.UpdateSharePermissionsRequest:
    properties:
      permissions:
        items:
          $ref: '#/definitions/garden.GardenPermission'
        type: array
      user_id:
        type: string
    required:
    - permissions
    - user_id
    type: object
  marketplace.CompleteDeliveryResponse:
    properties:
      message:
        type: string
      reward_paid:
        type: integer
    type: object
  marketplace.CreateDeliveryRequestRequest:
    properties:
      deadline:
        example: "2026-01-15T18:00:00Z"
        type: string
      plant_type_id:
        type: string
      reward:
        minimum: 10
        type: integer
    required:
    - deadline
    - plant_type_id
    - reward
    type: object
  marketplace.CreatePlantListingRequest:
    properties:
      plant_id:
        type: string
      price:
        minimum: 1
        type: integer
    required:
    - plant_id
    - price
    type: object
  marketplace.DeliveryRequest:
    properties:
      accepted_by:
        type: string
      acceptor:
        $ref: '#/definitions/auth.PublicUser'
      completed_at:
        type: string
      created_at:
        type: string
      deadline:
        type: string
      id:
        type: string
      plant_type:
        $ref: '#/definitions/garden.PlantType'
      plant_type_id:
        type: string
      requester:
        allOf:
        - $ref: '#/definitions/auth.PublicUser'
        description: Relationships
      requester_id:
        type: string
      reward:
        type: integer
      status:
        $ref: '#/definitions/marketplace.RequestStatus'
      updated_at:
        type: string
    type: object
  marketplace.DeliveryRequestsResponse:
    properties:
      delivery_requests:
        items:
          $ref: '#/definitions/marketplace.DeliveryRequest'
        type: array
      total:
        type: integer
    type: object
  marketplace.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  marketplace.ListingStatus:
    enum:
    - active
    - sold
    - expired
    type: string
    x-enum-varnames:
    - ListingStatusActive
    - ListingStatusSold
    - ListingStatusExpired
  marketplace.MarketplaceStatsResponse:
    properties:
      active_delivery_requests:
        type: integer
      active_listings:
        type: integer
      total_delivery_requests:
        type: integer
      total_listings:
        type: integer
      total_transactions:
        type: integer
      total_volume:
        type: integer
    type: object
  marketplace.PlantListing:
    properties:
      buyer_id:
        type: string
      created_at:
        type: string
      expires_at:
        type: string
      id:
        type: string
      plant:
        $ref: '#/definitions/garden.Plant'
      plant_id:
        type: string
      price:
        type: integer
      seller:
        allOf:
        - $ref: '#/definitions/auth.PublicUser'
        description: Relationships
      seller_id:
        type: string
      status:
        $ref: '#/definitions/marketplace.ListingStatus'
      updated_at:
        type: string
    type: object
  marketplace.PlantListingsResponse:
    properties:
      listings:
        items:
          $ref: '#/definitions/marketplace.PlantListing'
        type: array
      total:
        type: integer
    type: object
  marketplace.RequestStatus:
    enum:
    - open
    - accepted
    - completed
    type: string
    x-enum-varnames:
    - RequestStatusOpen
    - RequestStatusAccepted
    - RequestStatusCompleted
  marketplace.SuccessResponse:
    properties:
      message:
        type: string
    type: object
  store.BuySeedRequest:
    properties:
      plant_type_id:
        type: string
      quantity:
        maximum: 10
        minimum: 1
        type: integer
    required:
    - plant_type_id
    - quantity
    type: object
  store.BuySeedResponse:
    properties:
      plant_type:
        $ref: '#/definitions/garden.PlantType'
      quantity:
        type: integer
      total_cost:
        type: integer
      user_coins:
        type: integer
    type: object
info:
  contact: {}
  description: A robust RESTful API for a virtual garden management game built with
    Go.
  title: Virtual Garden Management System API
  version: "1.0"
paths:
  /audit/gardens/{garden_id}/activity:
    get:
      consumes:
      - application/json
      description: Get the current user's recent actions in a garden
      parameters:
      - description: Garden ID
        in: path
        name: garden_id
        required: true
        type: string
      - default: 20
        description: Limit results
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Garden activity logs
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - bearer: []
      summary: Get garden activity
      tags:
      - audit
  /audit/logs:
    get:
      consumes:
      - application/json
      description: Get the current user's audit logs with optional filtering
      parameters:
      - description: Action filter
        in: query
        name: action
        type: string
      - description: Resource filter
        in: query
        name: resource
        type: string
      - description: Resource ID filter
        in: query
        name: resource_id
        type: string
      - description: Status filter
        in: query
        name: status
        type: string
      - description: Start date (YYYY-MM-DD)
        in: query
        name: start_date
        type: string
      - description: End date (YYYY-MM-DD)
        in: query
        name: end_date
        type: string
      - default: 50
        description: Limit results
        in: query
        name: limit
        type: integer
      - default: 0
        description: Offset results
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Audit logs with pagination
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - bearer: []
      summary: Get audit logs
      tags:
      - audit
  /audit/stats:
    get:
      consumes:
      - application/json
      description: Get audit statistics for the current user's actions
      parameters:
      - default: 30
        description: Number of days to analyze
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Audit statistics
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - bearer: []
      summary: Get audit statistics
      tags:
      - audit
  /audit/users/{user_id}/activity:
    get:
      consumes:
      - application/json
      description: Get the current user's recent activity; other users' activity is
        forbidden
      parameters:
      - description: User ID
        in: path
        name: user_id
        required: true
        type: string
      - default: 20
        description: Limit results
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: User activity logs
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden - Another user's activity
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - bearer: []
      summary: Get user activity
      tags:
      - audit
  /auth/login:
    post:
      consumes:
      - application/json
      description: Login with username and password to get JWT token
      parameters:
      - description: User login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.AuthResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized - Invalid credentials
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Authenticate user
      tags:
      - authentication
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Revoke every token issued to the user, signing them out on every
        device
      produces:
      - application/json
      responses:
        "200":
          description: Logout success message
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized - Invalid, expired, or revoked token
          schema:
            additionalProperties: true
            type: object
      security:
      - bearer: []
      summary: Logout user
      tags:
      - authentication
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Exchange a valid, unrevoked token for a new one with a fresh expiry
      produces:
      - application/json
      responses:
        "200":
          description: New token and expiry
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized - Invalid, expired, or revoked token
          schema:
            additionalProperties: true
            type: object
      security:
      - bearer: []
      summary: Refresh JWT token
      tags:
      - authentication
  /auth/register:
    post:
      consumes:
      - application/json
      description: Create a new user account with the provided information
      parameters:
      - description: User registration data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/auth.AuthResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict - Username or email already exists
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Register a new user
      tags:
      - authentication
  /garden-shares/access-links:
    post:
      consumes:
      - application/json
      description: Create a shareable link for garden access with specified permissions
      parameters:
      - description: Access link creation data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/garden.CreateAccessLinkRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created access link
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden - Not garden owner
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Garden not found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - bearer: []
      summary: Create garden access link
      tags:
      - garden-sharing
  /garden-shares/garden/{garden_id}:
    get:
      consumes:
      - application/json
      description: Get all users who have access to a specific garden
      parameters:
      - description: Garden ID
        in: path
        name: garden_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of garden shares
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden - Not garden owner
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Garden not found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - bearer: []
      summary: Get garden shares
      tags:
      - garden-sharing
  /garden-shares/garden/{garden_id}/access-links:
    get:
      consumes:
      - application/json
      description: Get all access links for a garden
      parameters:
      - description: Garden ID
        in: path
        name: garden_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of access links
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden - Not garden owner
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Garden not found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - bearer: []
      summary: Get access links
      tags:
      - garden-sharing
  /garden-shares/garden/{garden_id}/access-links/{link_id}/deactivate:
    post:
      consumes:
      - application/json
      description: Deactivate an access link for a garden
      parameters:
      - description: Garden ID
        in: path
        name: garden_id
        required: true
        type: string
      - description: Access Link ID
        in: path
        name: link_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Access link deactivated successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden - Not garden owner
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Access link not found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - bearer: []
      summary: Deactivate access link
      tags:
      - garden-sharing
  /garden-shares/garden/{garden_id}/permissions:
    put:
      consumes:
      - application/json
      description: Update permissions for a user's access to a garden
      parameters:
      - description: Garden ID
        in: path
        name: garden_id
        required: true
        type: string
      - description: Permission update data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/garden.UpdateSharePermissionsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Updated garden share
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden - Not garden owner
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Garden share not found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - bearer: []
      summary: Update share permissions
      tags:
      - garden-sharing
  /garden-shares/garden/{garden_id}/user/{user_id}:
    delete:
      consumes:
      - application/json
      description: Remove a user's access to a garden
      parameters:
      - description: Garden ID
        in: path
        name: garden_id
        required: true
        type: string
      - description: User ID to remove
        in: path
        name: user_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Garden share removed successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden - Not garden owner
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Garden share not found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - bearer: []
      summary: Remove garden share
      tags:
      - garden-sharing
  /garden-shares/join:
    post:
      consumes:
      - application/json
      description: Join a garden using an access link token
      parameters:
      - description: Join garden data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/garden.JoinGardenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Joined the garden, or already a member
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Access link not found or expired
          schema:
            additionalProperties: true
            type: object
        "409":
          description: The caller owns the garden
          schema:
            additionalProperties: true
            type: object
        "410":
          description: Access link expired or max uses reached
          schema:
            additionalProperties: true
